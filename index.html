<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>联屏 PaneWall — 把直播源收拢成一面墙</title>
<meta name="description" content="单文件 M3U8 / IPTV 播放器：导入自己的 m3u 源、多画面墙、抓播放器内部声音做实时字幕与翻译。免安装、离线可用、不内置任何频道源。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B1C1F'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%234A9EFF'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%23E6E4E1'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%23E6E4E1'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%234A9EFF'/%3E%3C/svg%3E">
<style>
:root{--bg:#131416;--card:#1D1F23;--line:#2E3238;--tx:#E9E7E4;--tx2:#9A9792;--acc:#4A9EFF}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:28px 18px}
main{width:100%;max-width:520px;text-align:center}
.mark{width:64px;height:64px;margin:0 auto 18px;display:block}
h1{font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:.5px}
h1 i{font-style:normal;font-weight:400;color:var(--tx2);font-size:18px;letter-spacing:1px;margin-left:6px}
.sub{color:var(--tx2);font-size:14px;margin:0 0 22px}
.tags{list-style:none;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:0;margin:0 0 26px}
.tags li{font-size:12.5px;color:var(--tx2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--card)}
.go{display:inline-block;background:var(--acc);color:#08131F;text-decoration:none;font-weight:600;
  font-size:16px;padding:13px 34px;border-radius:11px;transition:transform .12s ease,filter .12s ease}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.98)}
.go em{font-style:normal;font-weight:400;font-size:13px;opacity:.62;margin-left:7px}
.alt{display:inline-block;margin-top:10px;background:transparent;color:var(--tx);border:1px solid var(--line);
  text-decoration:none;font-weight:600;font-size:14px;padding:11px 24px;border-radius:11px;
  transition:border-color .12s ease,background .12s ease}
.alt:hover{border-color:var(--acc);background:var(--card)}
.alt em{font-style:normal;font-weight:400;font-size:12px;color:var(--tx2);margin-left:7px}
.note{margin:26px auto 0;max-width:470px;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:14px 16px;font-size:13px;color:var(--tx2);line-height:1.65}
.note b{color:var(--tx);font-weight:600}
.note a{color:var(--acc)}
footer{margin-top:28px;font-size:12px;color:#6B6862}
#busuanzi_container_page_pv{margin-top:8px;font-size:12px;color:#6B6862}
/* 语言切换：固定右上角。整页默认跟随浏览器语言，这里给一个手动覆盖入口 */
#langsw{position:fixed;top:14px;right:16px;z-index:9}
#langsw button{background:var(--card);color:var(--tx2);border:1px solid var(--line);border-radius:999px;
  font:inherit;font-size:12.5px;padding:5px 13px;cursor:pointer;transition:color .12s,border-color .12s}
#langsw button:hover{color:var(--tx);border-color:var(--acc)}
</style>
</head>
<body>
<div id="langsw"><button id="langBtn" type="button" title="Language / 语言">EN</button></div>
<main>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="7" fill="#1B1C1F"/>
    <rect x="6" y="6" width="9" height="9" rx="2" fill="#4A9EFF"/>
    <rect x="17" y="6" width="9" height="9" rx="2" fill="#E6E4E1"/>
    <rect x="6" y="17" width="9" height="9" rx="2" fill="#E6E4E1"/>
    <rect x="17" y="17" width="9" height="9" rx="2" fill="#4A9EFF"/>
  </svg>
  <h1>联屏<i>PaneWall</i></h1>
  <p class="sub" data-t="sub"></p>
  <ul class="tags">
    <li data-t="tag1"></li>
    <li data-t="tag2"></li>
    <li data-t="tag3"></li>
    <li data-t="tag4"></li>
    <li data-t="tag5"></li>
  </ul>
  <a class="go" href="./web/PaneWall.html"><span data-t="go"></span><em data-t="go_em"></em></a><br>
  <a class="alt" href="https://github.com/podcatcher962/panewall/releases/latest"><span data-t="alt"></span><em data-t="alt_em"></em></a>

  <div class="note" data-t-html="note"></div>

  <footer>
    <span data-t="foot1"></span><br>
    <span data-t="foot2"></span>
    <div id="busuanzi_container_page_pv" style="display:none">
      <span data-t="pv"></span> <span id="busuanzi_value_page_pv"></span> · <span data-t="uv"></span> <span id="busuanzi_value_site_uv"></span>
    </div>
  </footer>
</main>
<script>
/* 落地页双语：默认跟随浏览器语言（与主程序一致的规则：zh* → 中文，其余 → 英文），
   右上角可手动覆盖并记住。这样非中文用户不会一进门就是满屏中文。 */
(function () {
  var T = {
    zh: {
      title: '联屏 PaneWall — 把直播源收拢成一面墙',
      desc: '单文件 M3U8 / IPTV 播放器：导入自己的 m3u 源、多画面墙、抓播放器内部声音做实时字幕与翻译。免安装、离线可用、不内置任何频道源。',
      sub: '把散落各处的直播源收拢成一面墙 —— 单文件播放器，免安装、离线可用。',
      tag1: '导入自己的 m3u', tag2: '多画面墙', tag3: '实时字幕与翻译',
      tag4: '截图 / 录像 / 录音', tag5: '不内置任何频道源',
      go: '在线试玩', go_em: 'Open',
      alt: '下载桌面版', alt_em: 'Windows exe · 推荐',
      note: '<b>想要「能截图、能录像」就装桌面版。</b>浏览器有一条硬限制：源不给跨域许可，页面就既截不了图也录不了音、抓不到音轨做字幕。桌面版自带<b>本机加速代理</b>，把那些请求先经你自己的电脑转一圈，浏览器就当成同源 —— 于是<b>截图、录像、录音、实时字幕对任何源都能用</b>，全程在本机，不外发任何数据。<br><br>'
          + '<b>在线版还有个限制：</b>本页走 https，网页在 https 下加载 http 的流会被浏览器当成「混合内容」拦掉 —— 这是浏览器的安全策略，不是工具的问题，而很多直播源恰恰是 http。所以在线版适合<b>试玩和分享</b>；想本地打开不装 exe，也可以到 <a href="https://github.com/podcatcher962/panewall">仓库</a>下载 <code>web/PaneWall.html</code> 双击打开。',
      foot1: '© 永远的兰兰 (Lanlan Eternal) · v1.8',
      foot2: '本工具不提供、不存储、不分发任何频道源',
      pv: '👁 本页访问', uv: '访客'
    },
    en: {
      title: 'PaneWall — Gather your live streams onto one wall',
      desc: 'A single-file M3U8 / IPTV player: import your own m3u playlists, a multi-view wall, and live subtitles plus translation taken from the player\'s own audio. No install, works offline, ships no channels of its own.',
      sub: 'Gather scattered live streams onto one wall \u2014 a single-file player. No install, works offline.',
      tag1: 'Import your own m3u', tag2: 'Multi-view wall', tag3: 'Live subtitles & translation',
      tag4: 'Snapshot / video / audio', tag5: 'Ships no channels',
      go: 'Try it online', go_em: 'Open',
      alt: 'Desktop build', alt_em: 'Windows exe \u00b7 recommended',
      note: '<b>Want snapshot and recording? Install the desktop build.</b> Browsers have a hard rule: if a source sends no CORS headers, the page can neither snapshot nor record it, and cannot tap its audio for subtitles. The desktop build ships a <b>local proxy</b> that routes those requests through your own machine first, so the browser treats them as same-origin \u2014 <b>snapshot, video, audio and live subtitles then work on any source</b>. Everything stays on your machine; nothing is sent anywhere.<br><br>'
          + '<b>One more limit online:</b> this page is served over https, and loading an http stream from an https page is blocked by browsers as "mixed content". That is a browser security policy, not a flaw in the tool \u2014 and many live sources are http. So the online version is best for <b>trying and sharing</b>; to open it locally without the exe, grab <code>web/PaneWall.html</code> from the <a href="https://github.com/podcatcher962/panewall">repository</a> and double-click it.',
      foot1: '© 永远的兰兰 (Lanlan Eternal) \u00b7 v1.8',
      foot2: 'This tool provides, stores and distributes no channels of its own',
      pv: '👁 views', uv: 'visitors'
    }
  };

  // 手动选择优先，其次跟随浏览器语言
  function pick() {
    try {
      var v = localStorage.getItem('PW_LANG');
      if (v === 'zh' || v === 'en') return v;
    } catch (e) {}
    var l = '';
    try { l = (navigator.languages && navigator.languages[0]) || navigator.language || ''; } catch (e) {}
    return /^zh/i.test(String(l)) ? 'zh' : 'en';
  }

  var cur = pick();
  function paint(l) {
    cur = l;
    var t = T[l], i;
    var nodes = document.querySelectorAll('[data-t]');
    for (i = 0; i < nodes.length; i++) {
      var k = nodes[i].getAttribute('data-t');
      if (t[k] != null) nodes[i].textContent = t[k];
    }
    var hn = document.querySelectorAll('[data-t-html]');
    for (i = 0; i < hn.length; i++) {
      var k2 = hn[i].getAttribute('data-t-html');
      if (t[k2] != null) hn[i].innerHTML = t[k2];
    }
    document.documentElement.lang = (l === 'en') ? 'en' : 'zh-CN';
    document.title = t.title;
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', t.desc);
    var b = document.getElementById('langBtn');
    if (b) b.textContent = (l === 'en') ? '中文' : 'EN';   // 按钮显示「切过去」的那个语言
  }
  paint(cur);

  var btn = document.getElementById('langBtn');
  if (btn) btn.addEventListener('click', function () {
    var next = (cur === 'en') ? 'zh' : 'en';
    try { localStorage.setItem('PW_LANG', next); } catch (e) {}
    paint(next);
  });
})();
</script>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
