<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>联屏 · PaneWall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B1C1F'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%234A9EFF'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%23E6E4E1'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%23E6E4E1'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%234A9EFF'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#1B1C1F; --card:#24262A; --card2:#2C2F34; --line:#3A3D43;
  --tx:#E6E4E1; --tx2:#A5A29D; --acc:#4A9EFF; --ok:#3FC08A; --warn:#E8A33D; --bad:#E2685F;
  --ui:1; --tap:34px; --r:10px;
}
html[data-theme="light"]{
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#EAECEF; --line:#D3D7DD;
  --tx:#1D1F23; --tx2:#5C636C; --acc:#1668C4; --ok:#1F8A5B; --warn:#B7761B; --bad:#C04A40;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:calc(14px * var(--ui))/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%; overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top ---------- */
#top{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
  padding:8px 12px; background:var(--card); border-bottom:1px solid var(--line);
}
#brand{display:flex; align-items:baseline; gap:7px; font-weight:700; letter-spacing:.04em; white-space:nowrap}
#brand b{font-size:17px}
#brand i{font-style:normal; font-size:10px; color:var(--tx2); letter-spacing:.14em; text-transform:uppercase}
#nav{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; margin-left:auto}
#nav::-webkit-scrollbar{display:none}
#nav button{
  flex:0 0 auto; background:transparent; border:1px solid transparent; color:var(--tx2);
  padding:7px 10px; border-radius:8px; white-space:nowrap; letter-spacing:.02em;
}
#nav button:hover{color:var(--tx); background:var(--card2)}
#nav button.on{color:var(--tx); background:var(--card2); border-color:var(--line)}
#top .gear{flex:0 0 auto}

/* ---------- views ---------- */
.view{display:none}
.view.on{display:block}
.pane{max-width:1000px; margin:0 auto; padding:18px 16px 60px}
.pane h2{margin:6px 0 12px; font-size:19px}
.pane h3{margin:20px 0 8px; font-size:15px; color:var(--tx)}
.pane p,.pane li{color:var(--tx2); line-height:1.75}
.pane ul{padding-left:20px}
.pane .note{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--acc);
  padding:10px 12px; border-radius:8px; color:var(--tx2); margin:12px 0}
.pane .note.warn{border-left-color:var(--warn)}
.pane code{background:var(--card2); padding:1px 5px; border-radius:4px; color:var(--tx); font-size:.92em}

/* ---------- live layout ---------- */
#wrap{display:grid; grid-template-columns:322px 1fr; gap:12px; padding:12px; align-items:start}
#side{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  display:flex; flex-direction:column; max-height:calc(100vh - 74px); overflow:hidden;
}
.sideTop{padding:10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; flex:0 0 auto}
.libbar{padding:8px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:5px; flex:0 0 auto}
#libSel{flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); border-radius:8px;
  padding:7px 8px; color:var(--tx); outline:none; font-size:.94em}
#libSel:focus{border-color:var(--acc)}
.libmeta{font-size:.8em; color:var(--tx2); padding-left:2px; line-height:1.4}
.mtbar{display:flex; gap:5px; padding:8px 10px 2px; flex:0 0 auto}
.mtbar button{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:7px;
  padding:6px 4px; font-size:.9em; color:var(--tx2); display:flex; align-items:center; justify-content:center; gap:4px}
.mtbar button.on{color:var(--tx); border-color:var(--acc); background:var(--card)}
.mtbar i{font-style:normal; font-size:.82em; opacity:.6}
.row{display:flex; gap:6px; align-items:center}
#q{
  flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; outline:none;
}
#q:focus{border-color:var(--acc)}
.btn{
  background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 11px;
  min-height:var(--tap); display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn:hover{border-color:var(--acc); color:var(--tx)}
.btn.primary{background:var(--acc); border-color:var(--acc); color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px; min-height:0; font-size:.9em}
.btn:disabled{opacity:.45; cursor:not-allowed}
.chips{display:grid; gap:5px; padding:8px 10px; border-bottom:1px solid var(--line);
  grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); max-height:168px; overflow:auto; flex:0 0 auto}
.chip{
  background:var(--card2); border:1px solid var(--line); border-radius:7px; padding:5px 7px;
  text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--tx2);
}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--acc); border-color:var(--acc); color:#fff}
.chip .n{opacity:.72; font-size:.86em; margin-left:4px}
.chip.list{grid-column:span 2}
#list{overflow:auto; flex:1 1 auto; min-height:0; padding:6px}
.ch{
  display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:8px; cursor:pointer;
  border:1px solid transparent;
}
.ch:hover{background:var(--card2)}
.ch.cur{background:var(--card2); border-color:var(--acc)}
.ch .lg{
  width:34px; height:34px; flex:0 0 34px; border-radius:6px; object-fit:contain;
  background:var(--card2); display:block;
}
.ch .lg.ph{display:flex; align-items:center; justify-content:center; color:var(--tx2); font-size:15px}
.ch .mt{min-width:0; flex:1}
.ch .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ch .sub{font-size:.82em; color:var(--tx2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ch .dot{width:7px; height:7px; border-radius:50%; flex:0 0 7px; background:var(--line)}
.ch .dot.ok{background:var(--ok)} .ch .dot.bad{background:var(--bad)} .ch .dot.q{background:var(--warn)}
.favb{
  background:transparent; border:0; color:var(--tx2); font-size:17px; line-height:1; padding:4px 6px;
  border-radius:6px; position:relative;
}
.favb::after{content:""; position:absolute; left:50%; top:50%; width:40px; height:40px; transform:translate(-50%,-50%)}
.favb.on{color:var(--warn)}
.favb:hover{background:var(--card2)}
#more{padding:8px; text-align:center; color:var(--tx2); font-size:.88em}
#empty{padding:26px 14px; text-align:center; color:var(--tx2); font-size:.92em}

/* ---------- stage ---------- */
#stage{display:flex; flex-direction:column; gap:10px; min-width:0}
#pv{
  position:relative; background:#000; border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center;
}
#v{width:100%; height:100%; background:#000; display:block}
#osm{
  position:absolute; inset:0; display:flex; flex-direction:column; gap:8px; align-items:center;
  justify-content:center; text-align:center; color:#cfd3da; padding:20px; pointer-events:none;
}
#osm .big{font-size:16px; color:#e8eaee}
#osm .sm{font-size:12.5px; color:#98a0ac; max-width:520px; line-height:1.6}
#osm.hide{display:none}
#spin{position:absolute; right:12px; top:12px; display:none; gap:5px; align-items:center;
  background:rgba(0,0,0,.55); color:#fff; padding:4px 9px; border-radius:20px; font-size:12px}
#spin.on{display:flex}
#spin i{width:11px;height:11px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:block}
@keyframes sp{to{transform:rotate(360deg)}}
#badge{position:absolute; left:12px; top:12px; display:none; gap:6px; align-items:center;
  background:rgba(226,104,95,.92); color:#fff; padding:5px 10px; border-radius:20px; font-size:12px}
#badge.on{display:flex}

/* ---------- 连接状态条：播放器顶部的实时状态 ---------- */
#cst{position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:26;
  display:none; align-items:center; gap:8px; max-width:calc(100% - 168px);
  background:rgba(10,13,18,.7); color:#e7ecf3; border:1px solid rgba(255,255,255,.09);
  padding:5px 11px; border-radius:20px; font-size:12px; line-height:1; white-space:nowrap;
  cursor:pointer; user-select:none; -webkit-user-select:none;
  -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px)}
#cst.on{display:flex}
#cst .dot{width:8px;height:8px;border-radius:50%;background:#8b93a1;flex:0 0 auto}
#cst .tx{display:flex; align-items:center; gap:6px; overflow:hidden; min-width:0}
#cst b{font-weight:600; flex:0 0 auto}
#cst em{font-style:normal; color:#98a2b3; overflow:hidden; text-overflow:ellipsis}
#cst .bar{width:46px; height:3px; border-radius:2px; background:rgba(255,255,255,.14);
  overflow:hidden; flex:0 0 auto; display:none}
#cst .bar.on{display:block}
#cst .bar i{display:block; height:100%; width:0; background:#e8b23a; transition:width .3s}
#cst.mini{padding:6px}
#cst.mini .tx, #cst.mini .bar{display:none}
#cst.conn .dot, #cst.man .dot, #cst.buf .dot, #cst.stall .dot{
  background:#e8b23a; animation:cstP 1s ease-in-out infinite}
#cst.play .dot{background:#3ec46d}
#cst.play .bar i{background:#3ec46d}
#cst.fail .dot{background:#e2564a}
#cst.fail .bar{display:none}
@keyframes cstP{0%,100%{opacity:1}50%{opacity:.22}}

#recBadge{position:absolute; left:12px; bottom:12px; display:none; gap:7px; align-items:center;
  background:rgba(0,0,0,.6); color:#fff; padding:5px 11px; border-radius:20px; font-size:12px}
#recBadge.on{display:flex}
#recBadge .rd{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:bl 1s steps(2,start) infinite}
@keyframes bl{50%{opacity:.15}}

/* ---------- 字幕 / 实时翻译 ---------- */
#cap{
  position:absolute; left:4%; right:4%; bottom:9%; z-index:22; display:none;
  text-align:center; pointer-events:none; line-height:1.5;
}
#cap.on{display:block}
#capLines{display:inline-block; max-width:100%; text-align:center; background:transparent}
#cap .ln{
  display:block; margin:3px auto; padding:3px 11px; border-radius:8px; width:fit-content; max-width:100%;
  background:rgba(0,0,0,.62); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.9); word-break:break-word;
}
#cap .ln.dim{opacity:.7; font-size:.9em}
#cap .o{display:block}
#cap .p{display:block; opacity:.58; font-style:italic}
#cap .t{display:block; color:#9fd3ff; font-weight:700}
#cap .w{display:block; opacity:.55; font-size:.85em}
#cap.nosrc .o,#cap.nosrc .p{display:none}
#capGrip{
  position:absolute; right:5px; top:50%; transform:translateY(-50%); pointer-events:auto; cursor:ns-resize;
  width:22px; height:36px; border:0; border-radius:6px; background:rgba(0,0,0,.5); color:#cfd3da;
  font-size:12px; line-height:1; opacity:0; transition:opacity .15s; touch-action:none;
}
#cap:hover #capGrip{opacity:1}
#capSet{
  position:absolute; right:31px; top:50%; transform:translateY(-50%); pointer-events:auto; cursor:pointer;
  width:22px; height:36px; border:0; border-radius:6px; background:rgba(0,0,0,.5); color:#cfd3da;
  font-size:13px; line-height:1; opacity:0; transition:opacity .15s;
}
#cap:hover #capSet{opacity:1}
#pv.natc video::cue{visibility:hidden}
#btnCap.live{border-color:var(--ok); color:var(--ok)}

#bar{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:8px 10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
}
#bar .sp{flex:1}
#vol{width:96px; accent-color:var(--acc)}
#now{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:9px 12px;
  display:flex; align-items:center; gap:10px; min-width:0;
}
#now .mt{min-width:0; flex:1}
#now .nm{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#now .sub{font-size:.83em; color:var(--tx2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#recTimer{color:var(--bad); font-variant-numeric:tabular-nums; font-size:.9em}

/* ---------- grid / cards ---------- */
.cards{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); margin-top:12px}
.card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px}
.card h4{margin:0 0 6px; font-size:14px}
.card .meta{font-size:.83em; color:var(--tx2)}
/* mosaic */
#mos{display:grid; gap:6px; background:#000; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; aspect-ratio:16/9}
#mos.g4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr}
#mos.g2{grid-template-columns:1fr 1fr; grid-template-rows:1fr}
#mos.g1{grid-template-columns:1fr}
#mos .cell{position:relative; background:#08090b; overflow:hidden}
#mos video{width:100%; height:100%; object-fit:cover; background:#000}
#mos .lab{position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.6); color:#fff;
  font-size:11.5px; padding:2px 7px; border-radius:10px; max-width:88%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#mos .x{position:absolute; right:5px; top:5px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:50%;
  width:22px; height:22px; line-height:1; font-size:13px}
#mos .cell.sel{outline:2px solid var(--acc); outline-offset:-2px}

/* ---------- modal ---------- */
#modal{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:200; padding:16px}
#modal.on{display:flex}
#mbox{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; width:min(520px,100%); max-height:86vh; overflow:auto}
#mbox h3{margin:0 0 12px; font-size:16px}
#mbox .fld{margin:10px 0}
#mbox label{display:block; font-size:.88em; color:var(--tx2); margin-bottom:4px}
#mbox input[type=text],#mbox input[type=url],#mbox input[type=number],#mbox select,#mbox textarea{
  width:100%; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; outline:none;
}
#mbox .acts{display:flex; gap:8px; justify-content:flex-end; margin-top:14px}
.pick{display:flex; flex-wrap:wrap; gap:6px}
.pick button{background:var(--card2); border:1px solid var(--line); border-radius:20px; padding:5px 12px; color:var(--tx2)}
.pick button.on{background:var(--acc); border-color:var(--acc); color:#fff}

#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); opacity:0;
  background:#111; color:#fff; border:1px solid #333; padding:9px 15px; border-radius:22px; z-index:400;
  pointer-events:none; transition:.22s; max-width:88vw; text-align:center}
html[data-theme="light"] #toast{background:#23262B; border-color:#3a3d43; color:#fff}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
html[data-motion="low"] *{animation:none!important; transition:none!important}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:10px 0}
.kv b{font-weight:600; color:var(--tx)}
.foot{margin-top:26px; padding-top:14px; border-top:1px solid var(--line); color:var(--tx2); font-size:.86em; text-align:center}

/* ---------- mobile ---------- */
@media (max-width:840px){
  #wrap{grid-template-columns:1fr; padding:8px; gap:8px}
  #side{max-height:none; order:2}
  #stage{order:1}
  #list{max-height:58vh}
  #brand i{display:none}
  #nav button{padding:7px 8px; font-size:.94em}
  #vol{width:70px}
  .pane{padding:14px 12px 54px}
}

/* ---------- phone：窄屏（竖屏手机）----------
   顶上 9 个按钮原来是一行横排 + 能左右滑，手机上看就是「半截按钮」，
   像是横屏页面。这里改成网格排布，两行放完，不再需要左右滑。 */
@media (max-width:600px){
  #top{flex-wrap:wrap; gap:6px; padding:8px 10px}
  #nav{flex:1 1 100%; margin-left:0; display:grid; gap:4px;
       grid-template-columns:repeat(5,1fr); overflow:visible}
  #nav button{padding:7px 2px; font-size:.86em; text-align:center;
              line-height:1.25; white-space:normal}
  #wrap{padding:8px 8px 14px; gap:8px}
  #bar{gap:5px; padding:7px 8px}
  #bar .btn.sm{padding:6px 8px; font-size:.9em}
  #vol{width:60px}
  .sideTop{padding:9px}
  .chips{grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); max-height:140px}
}
</style>
</head>
<body>

<header id="top">
  <div id="brand"><b>联屏</b><i>PaneWall</i></div>
  <nav id="nav">
    <button data-v="live" class="on" data-i18n="nav_live">直播</button>
    <button data-v="fav" data-i18n="nav_fav">收藏</button>
    <button data-v="rec" data-i18n="nav_rec">录制</button>
    <button data-v="mos" data-i18n="nav_mos">多画面</button>
    <button data-v="set" data-i18n="nav_set">设置</button>
    <button data-v="help" data-i18n="nav_help">帮助</button>
    <button data-v="faq" data-i18n="nav_faq">常见问题</button>
    <button data-v="disc" data-i18n="nav_disc">免责声明</button>
    <button data-v="about" data-i18n="nav_about">关于</button>
  </nav>
</header>

<main id="main">

  <!-- ============ LIVE ============ -->
  <section id="view-live" class="view on">
    <div id="wrap">
      <aside id="side">
        <div class="sideTop">
          <div class="row">
            <input id="q" type="search" data-i18n-ph="ph_search" placeholder="搜索频道（可拼音首字母，如 cctv / ys）">
            <button id="btnClearQ" class="btn sm ghost hide">✕</button>
          </div>
          <div class="row">
            <button class="btn sm" data-act="impFile" data-i18n="b_file">导入文件</button>
            <button class="btn sm" data-act="impDir" data-i18n="b_dir">导入文件夹</button>
            <button class="btn sm" data-act="impUrl" data-i18n="b_url">从网址</button>
          </div>
          <div class="row">
            <button class="btn sm" data-act="scan" data-i18n="b_scan">体检本类</button>
            <button class="btn sm" data-act="clear" data-i18n="b_clear">清空库</button>
          </div>
        </div>
        <div class="libbar">
          <div class="row">
            <select id="libSel" data-i18n-title="ti_lib"></select>
            <button class="btn sm ghost" data-act="libRename" data-i18n-title="ti_lib_rename">✎</button>
            <button class="btn sm ghost" id="libDel" data-act="libDel" data-i18n-title="ti_lib_del">🗑</button>
          </div>
          <div id="libMeta" class="libmeta"></div>
        </div>
        <div id="mtBar" class="mtbar">
          <button data-mt="all" class="on"><span data-i18n="mt_all">全部</span><i id="mtN_all"></i></button>
          <button data-mt="video">📺 <span data-i18n="mt_video">视频</span><i id="mtN_video"></i></button>
          <button data-mt="audio">🎵 <span data-i18n="mt_audio">音频</span><i id="mtN_audio"></i></button>
        </div>
        <div id="catChips" class="chips"></div>
        <div id="list"></div>
        <div id="more" class="hide"></div>
      </aside>

      <div id="stage">
        <div id="pv">
          <video id="v" playsinline webkit-playsinline></video>
          <div id="osm">
            <div class="big" data-i18n="osm_big">还没有选台</div>
            <div class="sm" data-i18n="osm_sm">左侧导入你的 .m3u 播放列表（可以直接选桌面上的 M3U8 文件夹），点频道即可开播。</div>
          </div>
          <div id="spin"><i></i><span data-i18n="loading">连接中…</span></div>
          <div id="badge"></div>
          <div id="cst" class="cst"><span class="dot"></span><span class="tx"><b id="cstPhase"></b><em id="cstInfo"></em></span><span class="bar" id="cstBar"><i id="cstFill"></i></span></div>
          <div id="recBadge"><span class="rd"></span><span id="recBadgeTx"></span></div>
          <div id="cap"><div id="capLines"></div><button id="capSet" type="button" data-act="capCfg" data-i18n-title="ti_capset">⚙</button><button id="capGrip" type="button">⋮⋮</button></div>
        </div>
        <div id="bar">
          <button class="btn sm" data-act="prev" data-i18n-title="ti_prev">⏮</button>
          <button class="btn sm" data-act="pp" id="btnPP" data-i18n-title="ti_pp">⏯</button>
          <button class="btn sm" data-act="next" data-i18n-title="ti_next">⏭</button>
          <button class="btn sm" data-act="mute" id="btnMute" data-i18n-title="ti_mute">🔊</button>
          <input id="vol" type="range" min="0" max="1" step="0.02" value="1">
          <span class="sp"></span>
          <button class="btn sm" id="btnCap" data-act="capOne" data-i18n-title="ti_capone">💬 <span data-i18n="b_cap">字幕</span></button>
          <button class="btn sm" data-act="shot" data-i18n="b_shot" data-i18n-title="ti_shot">📷 截屏</button>
          <button class="btn sm" data-act="recV" data-i18n="b_recv" data-i18n-title="ti_recv">⏺ 录像</button>
          <button class="btn sm" data-act="recA" data-i18n="b_reca" data-i18n-title="ti_reca">🎙 录音</button>
          <button class="btn sm" data-act="recStop" id="btnRecStop" data-i18n="b_recstop" data-i18n-title="ti_recstop" disabled>⏹ 停止</button>
          <span class="sp"></span>
          <button class="btn sm" data-act="pip" data-i18n="b_pip">画中画</button>
          <button class="btn sm" data-act="full" data-i18n="b_full">全屏</button>
          <button class="btn sm" data-act="fit" id="btnFit" data-i18n-title="ti_fit">⤢</button>
        </div>
        <div id="now">
          <div class="mt">
            <div class="nm" id="nowName" data-i18n="none_ch">未选择频道</div>
            <div class="sub" id="nowSub">—</div>
          </div>
          <span id="recTimer" class="hide"></span>
          <button class="btn sm" data-act="addList" id="btnAddList" data-i18n="b_addlist">加入列表</button>
          <button class="favb" data-act="favCur" id="btnFavCur">☆</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ FAV ============ -->
  <section id="view-fav" class="view">
    <div class="pane">
      <h2 data-i18n="fav_h">收藏</h2>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn" data-act="favExport" data-i18n="b_favexport">导出收藏为 m3u</button>
        <button class="btn" data-act="favGo" data-i18n="b_favgo">去播放</button>
      </div>
      <div id="favList" class="cards"></div>
    </div>
  </section>

  <!-- ============ REC ============ -->
  <section id="view-rec" class="view">
    <div class="pane">
      <h2 data-i18n="rec_h">录制</h2>
      <div class="note" data-i18n="rec_note">录制在本地实时完成，不上传任何服务器。录完点「下载」保存到本机；关闭页面或刷新会丢失未下载的片段。</div>
      <div class="row" style="flex-wrap:wrap">
        <label style="color:var(--tx2);font-size:.9em" data-i18n="rec_dur">定时录制：</label>
        <select id="recMin" class="btn sm" style="width:auto">
          <option value="0" data-i18n="rec_off">不定时（手动停）</option>
          <option value="1">1 min</option><option value="5">5 min</option>
          <option value="10">10 min</option><option value="30">30 min</option>
          <option value="60">60 min</option>
        </select>
      </div>
      <div id="recList" class="cards"></div>
      <div id="recEmpty" style="color:var(--tx2);margin-top:12px" data-i18n="rec_empty">本次会话还没有录制内容。</div>
    </div>
  </section>

  <!-- ============ MOSAIC ============ -->
  <section id="view-mos" class="view">
    <div class="pane" style="max-width:1180px">
      <h2 data-i18n="mos_h">多画面</h2>
      <div class="note" data-i18n="mos_note">同时在墙上播放 2 路或 4 路。点格子选中后，用左侧「直播」页的列表换台；也可先设好再切回来。多路同时播放很吃带宽与算力，源不稳会各自卡顿。</div>
      <div class="row" style="flex-wrap:wrap;margin-bottom:10px">
        <span style="color:var(--tx2);font-size:.9em" data-i18n="mos_mode">布局</span>
        <button class="btn sm" data-act="mosLayout" data-n="1">1</button>
        <button class="btn sm" data-act="mosLayout" data-n="2">2</button>
        <button class="btn sm" data-act="mosLayout" data-n="4">4</button>
        <span class="sp"></span>
        <span id="mosHint" style="color:var(--tx2);font-size:.88em"></span>
        <button class="btn sm" data-act="mosClear" data-i18n="mos_clear">全部清空</button>
      </div>
      <div id="mos" class="g4"></div>
    </div>
  </section>

  <!-- ============ SET ============ -->
  <section id="view-set" class="view">
    <div class="pane">
      <h2 data-i18n="set_h">设置</h2>
      <div id="setBody"></div>
      <div class="row" style="flex-wrap:wrap;margin-top:18px">
        <button class="btn" data-act="expJson" data-i18n="b_expjson">导出备份</button>
        <button class="btn" data-act="impJson" data-i18n="b_impjson">导入备份</button>
        <button class="btn" data-act="reset" data-i18n="b_reset">恢复默认设置</button>
      </div>
    </div>
  </section>

  <!-- ============ DOCS ============ -->
  <section id="view-help"  class="view"><div class="pane" id="doc-help"></div></section>
  <section id="view-faq"   class="view"><div class="pane" id="doc-faq"></div></section>
  <section id="view-disc"  class="view"><div class="pane" id="doc-disc"></div></section>
  <section id="view-about" class="view"><div class="pane" id="doc-about"></div></section>

</main>

<div id="toast"></div>

<input type="file" id="fDir" webkitdirectory directory multiple class="hide">
<input type="file" id="fJson" accept=".json,application/json" class="hide">

/* 语言：auto = 跟随系统/浏览器。这是个播放器，国内外都有人用，
   首次打开不该预设中文 —— 所以默认 auto，按 navigator.language 判：
   以 zh 开头走中文，其余走英文；拿不到任何语言信息时才退回中文。 */
function sysLang() {
  var l = '';
  try { l = (navigator.languages && navigator.languages[0]) || navigator.language || ''; } catch (e) {}
  if (!l) { try { l = (Intl.DateTimeFormat().resolvedOptions().locale) || ''; } catch (e) {} }
  if (!l) return 'zh';
  return /^zh/i.test(String(l)) ? 'zh' : 'en';
}
function curLang() {
  if (!S.lang || S.lang === 'auto') return sysLang();
  return (S.lang === 'en') ? 'en' : 'zh';
}
function L(k, a) {
  var d = I18N[curLang()] || I18N.zh;
  var s = d[k] != null ? d[k] : (I18N.zh[k] != null ? I18N.zh[k] : k);
  if (a) for (var p in a) s = s.split('{' + p + '}').join(a[p]);
  return s;
}
function fillLabels() {
  $$('[data-i18n]').forEach(function (e) { e.textContent = L(e.getAttribute('data-i18n')); });
  $$('[data-i18n-ph]').forEach(function (e) { e.setAttribute('placeholder', L(e.getAttribute('data-i18n-ph'))); });
  $$('[data-i18n-title]').forEach(function (e) { e.setAttribute('title', L(e.getAttribute('data-i18n-title'))); });
}

      + '<li>Press <b>💬 Subtitles</b> on the player bar — it is the <b>one-click switch</b>: one click lines up recognition and free translation and starts captioning, another click stops it. For settings, <b>right-click</b> it (long-press on a phone) or use the gear on the caption overlay. Three routes: the channel\u2019s <b>own subtitle track</b> (used automatically when present \u2014 free and most accurate), <b>live subtitles</b> (tap the playing sound, transcribe, translate), or <b>original text only</b>.</li>'
      + '<li>Live subtitles need <b>no microphone</b>. The source defaults to <b>Auto</b>: on a computer the player\u2019s own audio track is tapped first and tab audio is used if that fails; on a phone (which cannot share a screen) the microphone is used to hear the speaker. Pick a specific source if you prefer.</li>'
      + '<li><b>The spoken language does not have to be chosen</b> \u2014 it defaults to <b>Auto-detect</b>. The app works it out itself with the browser\u2019s local detector (and whatever the recognition service reports), then translates from that language. Pin a specific language only if you want to.</li>'
      + '<li>Turning speech into text needs a recognition engine \u2014 paste a free SiliconFlow API key (SenseVoiceSmall is currently a free model, no top-up needed). <b>Translation can be entirely free</b>: "built into the browser" uses the browser\u2019s own offline model (no signup, no key, no text leaves the machine, works offline after the language pack is downloaded); "MyMemory" is keyless but online; "SiliconFlow free model" reuses the ASR key. Prefer no cloud? The desktop build will ship a local Whisper.</li>'
      + '<li>The caption bar has adjustable <b>size / height / backdrop</b>, can hide the original line, and the little handle on its right can be <b>dragged</b>. Embedded subtitle tracks are translated into your chosen language automatically.</li>'
      + '<li><b>Privacy:</b> live subtitles send each few-second <b>audio chunk</b> to the recognition service you chose. Leave live subtitles off to keep audio local.</li></ul>'
      + '<h3>5. Why some channels will not play</h3>'
      + '<p>The web build is bound by the browser same-origin policy: if a source sends no CORS header the browser refuses to fetch it. When a source has no CORS at all, playback falls back to the browser\u2019s native player \u2014 <b>watchable, but no snapshot or recording</b> \u2014 and the app says so. The desktop build ships a local proxy that brings most sources back.</p>'
      + '<h3>6. About channel sources</h3>'
      + '<p>This tool <b>bundles no channel source</b> and neither collects nor rebroadcasts anything. What you see depends entirely on what you imported. Live links expire fast — half a list can go dead in months. Keep your original .m3u files and re-run <b>Check</b> now and then.</p>'
      + '<div class="foot">© 永远的兰兰 (Lanlan Eternal)</div>'
  },
  faq: {
    zh: '<h2>常见问题</h2>'
      + '<h3>Q：为什么有的频道点进去一直转圈？</h3><p>A：<b>看播放器上方那条状态条</b> —— 它实时告诉你正在连接多久、试到第几条线路，连不上时直接写明原因（404 链接失效 / 没给跨域许可 / 服务器没响应 / 编码不支持）。多半是这个源本身失效了，或者源站没给跨域许可。<b>先换一个台</b>确认播放器正常；再用「体检本类」看这一批里哪些是活的。直播源时效很短，失效是常态。</p>'
      + '<h3>Q：录像/截屏按钮点了没反应？</h3><p>A：现在基本不会了 —— 走 hls.js 播放的源，画面取自本机，截屏、录音、录像都可用。若某个源抓不到播放器音轨，录音会自动改走「共享标签页」，在弹窗里选中该标签页并勾选「分享标签页音频」即可。只有画面本身来自别的站点、浏览器禁止抓取时，截屏才会失败。若某个源压根没给跨域许可、hls.js 拉不动，会自动退回浏览器原生播放：<b>能看，但截不了图、录不了音</b>，界面会明确告诉你。</p>'
      + '<h3>Q：录出来的文件是什么格式？能直接播吗？</h3><p>A：优先 MP4（浏览器支持的话），否则 WEBM。MP4 在手机、电脑、微信里都能直接播；WEBM 在部分 Windows 播放器里需要转换。</p>'
      + '<h3>Q：我导入的频道会保存吗？下次打开还在吗？</h3><p>A：会存在本机浏览器里。但清缓存或换浏览器就没了，所以「设置」里提供了<b>导出备份</b>，建议导一份留着。</p>'
      + '<h3>Q：多画面很卡怎么办？</h3><p>A：同时解码多路很吃资源。降到 2 路、或只保留网络好的台。卡顿是源的问题居多，不是播放器。</p>'
      + '<h3>Q：能看回看 / 节目单（EPG）吗？</h3><p>A：目前只做直播，不做回看与节目单。列表里带 EPG 信息也没用，我们不解析。</p>'
      + '<h3>Q：能加自己的台吗？</h3><p>A：能——把你的地址写进一个 .m3u 文件（<code>#EXTM3U</code> 开头，每台两行），用「导入文件」读进来即可。</p>'
      + '<h3>Q：实时字幕要花钱吗？会不会把我的声音传出去？</h3><p>A：<b>翻译可以一分钱不花</b> —— 选「浏览器内置」就是浏览器自带的离线模型，免注册、不要 Key、文字不出本机，语言包下好后断网也能用；「MyMemory」也免费，只是要联网。<b>识别</b>需要一个引擎（软件本身免费）：硅基流动的 SenseVoiceSmall <b>目前是免费模型</b>，手机号注册 + 实名后建一把 Key 就能用，不用充钱。开实时字幕时每段几秒的<b>音频</b>会发给识别服务；台自带的字幕轨则完全在本机处理、不联网。介意就别开实时字幕。</p>'
      + '<h3>Q：有没有完全不用注册、不用 Key 的办法？</h3><p>A：翻译有 —— 「浏览器内置」和「MyMemory」都不用 Key。识别一定要有个引擎，最省事的是硅基流动 —— 免费注册，建一把 Key 填进去就行，SenseVoiceSmall 目前是免费模型。桌面版会内置本地 Whisper，那才是彻底离线、零费用的识别。</p>'
      + '<h3>Q：原声语言要自己选吗？</h3><p>A：不用，默认就是<b>自动检测</b>。软件先用浏览器本地的语言检测器认（不联网、免费），认不出来再用本地词表兜底；识别服务返回的语言标记也会被采纳。检测到之后，播放条旁边和设置里都会显示「原声：英语」这样的提示。想手动锁定，就在「说话的语言」里选一个具体语言。</p>'
      + '<h3>Q：我电脑没有麦克风，能用实时字幕吗？</h3><p>A：能，而且正好是为这种情况设计的。软件直接抓<b>播放器内部的声音</b>（或你共享的标签页音频），根本不经过麦克风。</p>'
      + '<h3>Q：点了「字幕」没反应、一直不出字，怎么查？</h3><p>A：右键（手机上长按）播放条上的「字幕」按钮打开设置，点最上面的 <b>一键体检</b> —— 它会把整条链路逐项查一遍（浏览器、麦克风、声音来源、识别引擎、翻译通道），直接告诉你卡在哪一步、该怎么办。最常见的两个原因：① <b>识别引擎还没选、或没填 Key</b>（声音变文字必须有引擎，免费的也算）；② <b>没有正在播放的频道</b>，字幕没声音可听。</p>'
      + '<h3>Q：为什么字幕会慢几秒？</h3><p>A：要凑够一段音频才能识别，段长可在「字幕」设置里调（默认 5 秒）。调短更实时但更容易把词切断。</p>'

      + '<div class="foot">© 永远的兰兰 (Lanlan Eternal)</div>',
    en: '<h2>FAQ</h2>'
      + '<h3>Q: Some channels spin forever.</h3><p>A: <b>Watch the status bar above the player</b> \u2014 it shows how long the connection has been running, which line is being tried, and names the reason when it fails (404 dead link / missing CORS / no response / unsupported codec). Usually the source itself is dead, or sends no CORS header. Try another channel to confirm the player works, then run <b>Check</b>. Live sources expire quickly — dead links are normal.</p>'
      + '<h3>Q: Snapshot / record does nothing.</h3><p>A: It should work now. With hls.js playback the picture is local, so snapshot, audio and video recording all work. If a source\u2019s audio track cannot be tapped, recording falls back to <b>Share tab audio</b> \u2014 pick the tab and tick the audio box in the popup. Snapshot can still fail when the picture itself comes from a cross-origin page. If a source sends no CORS at all and hls.js cannot load it, playback falls back to the browser\u2019s native player \u2014 <b>watchable, but no snapshot or recording</b> \u2014 and the app tells you so.</p>'
      + '<h3>Q: What format are recordings?</h3><p>A: MP4 when supported, otherwise WEBM. MP4 plays anywhere; WEBM may need conversion on some Windows players.</p>'
      + '<h3>Q: Are my channels saved?</h3><p>A: Yes, in local browser storage. Clearing cache wipes them — use <b>Export backup</b> in Settings.</p>'
      + '<h3>Q: Multi-view is laggy.</h3><p>A: Decoding several streams is heavy. Drop to 2, or keep well-connected ones. Lag is usually the source, not the player.</p>'
      + '<h3>Q: Catch-up / EPG?</h3><p>A: Live only, by design.</p>'
      + '<h3>Q: Can I add my own channel?</h3><p>A: Yes — put it in a .m3u file (starts with <code>#EXTM3U</code>, two lines per channel) and import it.</p>'
      + '<h3>Q: Do live subtitles cost money, and does my audio leave the machine?</h3><p>A: <b>Translation can cost nothing at all</b> \u2014 pick "built into the browser" and the browser\u2019s own offline model does it: no signup, no key, no text leaving your machine, and it works offline once the language pack is downloaded. MyMemory is also free but needs the network. <b>Transcription</b> needs an engine (the app itself is free); SiliconFlow\u2019s SenseVoiceSmall is currently a <b>free model</b> \u2014 sign up, paste a key, no top-up needed. While live subtitles run each few-second <b>audio</b> chunk goes to the recognition service; a channel\u2019s own subtitle track is processed locally and never leaves the machine.</p>'
      + '<h3>Q: Is there a way with no signup and no key at all?</h3><p>A: For translation, yes \u2014 "built into the browser" and MyMemory both need no key. Transcription always needs an engine; the easiest is SiliconFlow \u2014 free signup, one key, and SenseVoiceSmall is currently a free model. The desktop build will ship a local Whisper, which is the truly offline, zero-cost option.</p>'
      + '<h3>Q: Do I have to pick the spoken language?</h3><p>A: No \u2014 it defaults to <b>Auto-detect</b>. The app first asks the browser\u2019s local language detector (offline and free), falls back to a local word list, and also accepts the language tag the recognition service returns. Once it knows, you will see something like "Source: English" next to the player bar and in the settings. Pin a specific language in "Spoken language" if you prefer.</p>'
      + '<h3>Q: My computer has no microphone. Can I still use live subtitles?</h3><p>A: Yes \u2014 that is exactly what this is built for. The app taps the <b>player\u2019s internal audio</b> (or a tab you choose to share) and never touches a microphone.</p>'
      + '<h3>Q: I press Subtitles and nothing happens, or no text ever appears.</h3><p>A: Right-click (long-press on a phone) the <b>Subtitles</b> button to open the settings, then hit <b>Health check</b> at the top. It walks the whole chain \u2014 browser, microphone, audio source, recognition engine, translation \u2014 and names the exact step that is stuck. The two usual culprits: (1) <b>no recognition engine, or no key</b> (speech-to-text needs an engine; free ones count), and (2) <b>nothing is playing</b>, so there is no audio to caption.</p>'
      + '<h3>Q: Why do the subtitles lag a few seconds?</h3><p>A: A whole chunk must accumulate before it can be transcribed. Adjust the chunk length in the Subtitles panel (5 s by default); shorter is more live but cuts words more often.</p>'

      + '<div class="foot">© 永远的兰兰 (Lanlan Eternal)</div>'
  },

      + '<h3>v1.8 更新</h3><p>①<b>出了桌面版（Windows exe）</b>，并且自带<b>本机代理</b>（把请求先经你自己的电脑转一圈）：原先那些「没给跨域许可」的源，在浏览器里只能看、截不了图也录不了音 —— 桌面版把这些请求先经你自己的电脑中转一圈，浏览器就当成同源，<b>截屏、录像、录音、实时字幕对任何源都能用了</b>。全程在本机，不外发任何数据。②代理只用在本机，<b>关掉即恢复原样</b>；设置面板里有一键自检，会当场告诉你通没通。③播放地址改为「代理优先、直连兜底」：万一代理这一路失败，仍会自动退回直连，不会因此看不了。</p>'
      + '<h3>v1.6 更新</h3><p>①<b>英文名改为 PaneWall</b>（原名不再使用），中文名「联屏」不变 —— pane 是窗玻璃的一格，wall 是许多格并排成的那面墙。②<b>新增在线版</b>：不下载，浏览器打开就能用。<b>但要注意</b>：在线版走的是 https，页面里的 http 源会被浏览器当成「混合内容」拦掉，所以在线版更适合试玩与分享；真要播 http 源，请下载 HTML 文件双击打开 —— 本地打开没有这条限制。</p><h3>v1.5 更新</h3><p>①<b>播放器上方新增实时状态条</b>：正在连接时会显示已经等了多久、试到第几条线路；出画面后报起播耗时、缓冲进度和下载速度 —— 再也不用对着黑屏猜是死链还是只是慢。'

/* ---------------- pinyin ---------------- */
var FPX = null;
function fullPy(str) {
  if (!FPX) { FPX = {}; for (var k in FP) { var cs = FP[k]; for (var i = 0; i < cs.length; i++) FPX[cs.charAt(i)] = k; } }
  var out = '';
  for (var j = 0; j < str.length; j++) {
    var c = str.charAt(j);
    out += (FPX[c] || c.toLowerCase());
  }
  return out.replace(/[^a-z0-9]/g, '');
}
function pyOf(str) {
  var out = '';
  for (var j = 0; j < str.length; j++) out += (PY[str.charAt(j)] || '');
  return out.replace(/[^a-z0-9]/g, '');
}

/* ---------------- m3u parse ---------------- */
function parseM3U(text, srcName) {
  var out = [], lines = String(text).split(/\r?\n/), cur = null, i, ln;
  for (i = 0; i < lines.length; i++) {
    ln = lines[i].trim();
    if (!ln) continue;
    if (ln.charAt(0) === '#') {
      if (ln.indexOf('#EXTINF') === 0) {
        var q = ln.lastIndexOf('"');
        var sep = q > -1 ? ln.indexOf(',', q) : ln.indexOf(',');
        var name = sep > -1 ? ln.slice(sep + 1).trim() : '';
        var meta = sep > -1 ? ln.slice(0, sep) : ln;
        var attrs = {}, re = /([a-zA-Z0-9_-]+)="([^"]*)"/g, m;
        while ((m = re.exec(meta))) attrs[m[1]] = m[2];
        cur = {
          n: name || attrs['tvg-name'] || '',
          l: attrs['tvg-logo'] || '',
          g: attrs['group-title'] || '',
          tvg: attrs['tvg-id'] || ''
        };
      }
      continue;
    }
    if (/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(ln)) {
      out.push({
        n: (cur && cur.n) || ln.slice(-42),
        u: ln,
        l: (cur && cur.l) || '',
        g: (cur && cur.g) || '',
        s: srcName || ''
      });
      cur = null;
    }
  }
  return out;
}

/* 判断音频 / 视频：后缀优先，其次看分类与名称关键词 */
function mediaKind(ch) {
  var u = (ch.u || '').toLowerCase();
  if (/\.(mp3|aac|ogg|m4a|flac|opus|wma)(\?|#|$)/.test(u)) return 'audio';
  var blob = ((ch.g || '') + ' ' + (ch.s || '') + ' ' + (ch.n || '')).toLowerCase();
  if (/(fm|收音机|广播|电台|radio|音频|音乐台|广播电台|电台节目)/.test(blob)) return 'audio';
  return 'video';
}

}
/* 老版本数据迁移：单库 XL_CH → 一个名为「我的直播源」的库 */

/* 新建库（同名则合并，可指定） */
function newLib(name, kind, mode) {

  for (var i = 0; i < DB.libs.length; i++) if (DB.libs[i].name === name) { exist = DB.libs[i]; break; }
  if (exist && mode === 'merge') { DB.cur = exist.id; saveDB(); return exist; }
  if (exist && mode !== 'new') {          // 默认复用同名库
    DB.cur = exist.id; saveDB(); return exist;
  }
  if (exist) name = name + ' ' + new Date().toLocaleTimeString(L('loc')).slice(0, 5);
  var l = { id: uid(), name: name, kind: kind || 'mixed', ts: Date.now(), srcs: [], chs: [] };
  DB.libs.push(l);

/* 向指定库追加频道（库内按 URL 去重） */
function addChannels(list, srcName, libId) {
  if (!list || !list.length) return 0;
  var lib = libId ? libById(libId) : curLib();
  if (!lib) lib = newLib(L('lib_default'), 'mixed');
  var known = {}, i;
  for (i = 0; i < lib.chs.length; i++) known[lib.chs[i].u] = 1;
  var added = 0;
  for (i = 0; i < list.length; i++) {
    if (!list[i] || !list[i].u || known[list[i].u]) continue;
    known[list[i].u] = 1;
    lib.chs.push(list[i]); added++;
  }
  if (srcName && lib.srcs.indexOf(srcName) < 0) lib.srcs.push(srcName);
  saveDB();

}

/* ---------------- category / filtering ---------------- */
/* 这两个键固定为内部标识，显示时再翻译，避免切语言导致分类失效 */
var CAT_ALL = '全部', CAT_FAV = '收藏';
function groupOf(ch) { return (ch.g && ch.g.trim()) || ch.s || L('nogroup'); }
function mtOk(ch) { return MTYPE === 'all' || mediaKind(ch) === MTYPE; }
function cats() {

  var src = curChs();
  for (var i = 0; i < src.length; i++) {
    if (!mtOk(src[i])) continue;
    var g = groupOf(src[i]);
    if (!seen[g]) { seen[g] = 1; out.push(g); }
  }
  for (var k in DB.lists) { if (out.indexOf(k) < 0) out.push(k); }
  return out;
}
function isFav(u) { return !!DB.favs[u]; }
function catCount(c) {
  if (c === CAT_FAV) return Object.keys(DB.favs).length;
  if (DB.lists[c]) return DB.lists[c].length;
  var n = 0, src = curChs();
  for (var i = 0; i < src.length; i++) {
    if (!mtOk(src[i])) continue;
    if (c === CAT_ALL || groupOf(src[i]) === c) n++;

  return n;
}
function baseList() {
  if (CAT === CAT_FAV) {
    var arr = [];
    for (var u in DB.favs) arr.push(DB.favs[u]);
    return arr;
  }
  if (DB.lists[CAT]) return DB.lists[CAT].slice();
  var src = curChs(), out = [];
  for (var i = 0; i < src.length; i++) {
    if (CAT === CAT_ALL || groupOf(src[i]) === CAT) out.push(src[i]);
  }
  return out;
}
function matchQ(ch, kw, kwpy) {
  var blob = (ch.n + ' ' + (ch.g || '') + ' ' + (ch.s || '')).toLowerCase();
  if (blob.indexOf(kw) >= 0) return true;
  if (!kwpy) return false;
  var nm = ch.n || '';
  if (fullPy(nm).indexOf(kwpy) >= 0) return true;
  if (pyOf(nm).indexOf(kwpy) >= 0) return true;
  var gt = (ch.g || '') + ' ' + (ch.s || '');
  if (fullPy(gt).indexOf(kwpy) >= 0) return true;
  if (pyOf(gt).indexOf(kwpy) >= 0) return true;
  return false;
}
function filtered() {
  var base = baseList(), out = [], i;
  for (i = 0; i < base.length; i++) { if (mtOk(base[i])) out.push(base[i]); }
  if (!Q) return out;
  var kw = Q.toLowerCase().trim();
  var kwpy = kw.replace(/[^a-z0-9]/g, '');
  var res = [];
  for (i = 0; i < out.length; i++) { if (matchQ(out[i], kw, kwpy)) res.push(out[i]); }
  return res;
}

  for (var k = 0; k < CONC; k++) worker();
}

function mosSet(idx, ch) {
  if (!MOS.cells[idx]) MOS.cells[idx] = null;
  var old = MOS.cells[idx];
  if (old && old.ctrl) { try { old.ctrl.destroy(); } catch (e) {} }
  MOS.cells[idx] = { n: ch.n, u: ch.u, ch: ch, ctrl: null };
  renderMos();
}
function mosClose(idx) {
  var c = MOS.cells[idx];

}
function mosAttach(idx) {
  var c = MOS.cells[idx], v = $('#mv' + idx);
  if (!c || !v) return;
  if (c.ctrl) { try { c.ctrl.destroy(); } catch (e) {} c.ctrl = null; }
  var url = prox(c.u);
  if (isHls(c.u) && HLS_JS_OK()) {
    var h = new window.Hls({ enableWorker: true, maxBufferLength: 15, manifestLoadingTimeOut: 12000, fragLoadingTimeOut: 20000 });
    c.ctrl = { destroy: function () { try { h.destroy(); } catch (e) {} } };
    h.on(window.Hls.Events.ERROR, function (e, d) { if (d && d.fatal) { /* leave it */ } });
    h.attachMedia(v);
    h.on(window.Hls.Events.MEDIA_ATTACHED, function () { h.loadSource(url); });
  } else {
    c.ctrl = { destroy: function () {} };
    v.src = url;
  }
  var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
}
function mosAddCurrent() {
  var ch = P.ch;

  for (var i = 0; i < MOS.n; i++) if (!MOS.cells[i]) { slot = i; break; }

/* ---------------- import ---------------- */
function readFileText(file, cb) {
  var r = new FileReader();
  r.onload = function () { cb(String(r.result || '')); };
  r.onerror = function () { cb(''); };
  r.readAsText(file, 'utf-8');
}
var pendingImport = null;
function importFiles(files) {
  var arr = Array.prototype.slice.call(files).filter(function (f) { return /\.(m3u8?|txt)$/i.test(f.name); });
  if (!arr.length) { toast(L('imp_fail')); return; }
  /* 文件夹导入 → 用最外层文件夹名当源库名；选中多个文件 → 用文件名/日期 */
  var rootName = '';
  for (var k = 0; k < arr.length; k++) {
    var rp = arr[k].webkitRelativePath || '';
    if (rp && rp.indexOf('/') > 0) { rootName = rp.split('/')[0]; break; }
  }
  var libName = rootName
    ? rootName
    : (arr.length === 1 ? arr[0].name.replace(/\.(m3u8?|txt)$/i, '')
                        : L('lib_import') + ' ' + new Date().toLocaleString(L('loc')).replace(/[/:]/g, '-').slice(0, 16));
  var exist = null;
  for (var q = 0; q < DB.libs.length; q++) if (DB.libs[q].name === libName) { exist = DB.libs[q]; break; }
  if (exist) {
    /* 同名库已存在：让用户选「合并进来」还是「另建一个新的」，绝不静默混淆 */
    pendingImport = { files: arr, name: libName };
    openModal('<h3>' + esc(L('lib_exists')) + '</h3>'
      + '<div class="fld"><div class="meta" style="color:var(--tx2);line-height:1.65">'
      + esc(L('lib_exists_hint', { n: libName, c: exist.chs.length })) + '</div></div>'
      + '<div class="acts"><button class="btn ghost" data-close="1">' + esc(L('b_cancel')) + '</button>'
      + '<button class="btn" data-act2="libNew">' + esc(L('lib_as_new')) + '</button>'
      + '<button class="btn primary" data-act2="libMerge">' + esc(L('lib_merge')) + '</button></div>');
    return;
  }
  doImport(arr, libName, 'new');
}
function doImport(arr, libName, mode) {
  var lib = newLib(libName, 'mixed', mode);
  var i = 0, totalAdded = 0, srcN = 0;
  function one() {
    if (i >= arr.length) {
      saveDB(); renderAll();
      toast(L('imported', { a: srcN, b: totalAdded }));
      return;
    }
    var f = arr[i++];
    readFileText(f, function (txt) {
      var name = f.name.replace(/\.(m3u8?|txt)$/i, '');
      var list = parseM3U(txt, name);
      if (list.length) { totalAdded += addChannels(list, name, lib.id); srcN++; }
      setTimeout(one, 0);
    });
  }
  one();
}
function importUrlDialog() {
  openModal('<h3>' + esc(L('b_url')) + '</h3>'
    + '<div class="fld"><label>URL</label><input id="mUrl" type="url" placeholder="https://example.com/list.m3u"></div>'
    + '<div class="fld"><label>' + esc(L('list_name')) + '</label><input id="mUrlName" type="text" placeholder=""></div>'

function fetchUrlList(url, name) {
  toast(L('loading'));
  fetch(url, { mode: 'cors' }).then(function (r) { return r.text(); }).then(function (t) {
    var nm = name || (url.split('/').pop() || L('lib_remote')).replace(/\.(m3u8?|txt)$/i, '');

/* ============================================================
   stat.js —— 连接状态条（v1.5）
   播放器顶部实时显示：正在连接多久 / 缓冲多少 / 为什么连不上。
   不改播放流程，只在关键节点读状态并画出来。
   ============================================================ */
var CST_T = {
  zh: {
    idle: '未连接',
    conn: '正在连接',
    man: '读取列表',
    buf: '缓冲中',
    play: '播放中',
    stall: '卡住了',
    fail: '连不上',
    tick: '已 {v}s',
    boot: '起播 {v}s',
    bufP: '缓冲 {v}%',
    bufS: '缓冲 {v}s',
    bw: '{v} KB/s',
    line: '第 {n}/{m} 条线路',
    nat: '原生播放（不能录/截）',
    key: '点状态条可收起',
    fall: '试了 {n} 条线路',
    /* 失败原因 */
    f404: '播放列表 404 —— 链接已失效',
    f403: '播放列表被拒绝（403）',
    fcors: '这个源不放行 —— 多半是没给跨域许可，或网络不通',
    fnet: '网络错误（DNS 或连接失败）',
    fto: '服务器无响应（超时）',
    fman: '播放列表拉不到',
    fparse: '播放列表格式不对',
    flevel: '清晰度信息拉不到',
    ffrag: '视频分片拉不到',
    ffrag404: '视频分片 404',
    fcodec: '浏览器不支持这个编码',
    fappend: '解码失败（编码不兼容）',
    fstall: '数据供不上（严重卡顿）',
    fkey: '加密流，需要密钥',
    fsrc: '浏览器不支持这个格式（多半是 HLS 流）',
    fabort: '加载被中止',
    fwhy: '原因：'
  },
  en: {
    idle: 'Not connected',
    conn: 'Connecting',
    man: 'Reading playlist',
    buf: 'Buffering',
    play: 'Playing',
    stall: 'Stalled',
    fail: 'Cannot connect',
    tick: '{v}s',
    boot: 'started in {v}s',
    bufP: 'buffer {v}%',
    bufS: 'buffer {v}s',
    bw: '{v} KB/s',
    line: 'line {n}/{m}',
    nat: 'native playback (no record/snapshot)',
    key: 'click the bar to fold',
    fall: '{n} lines tried',
    f404: 'Playlist 404 \u2014 dead link',
    f403: 'Playlist refused (403)',
    fcors: 'Not allowed through \u2014 usually a missing CORS header, or the network is blocked',
    fnet: 'Network error (DNS or connect failed)',
    fto: 'Server not responding (timeout)',
    fman: 'Playlist could not be loaded',
    fparse: 'Playlist is malformed',
    flevel: 'Quality list could not be loaded',
    ffrag: 'Video segments could not be loaded',
    ffrag404: 'Video segment 404',
    fcodec: 'This codec is not supported',
    fappend: 'Decode failed (incompatible codec)',
    fstall: 'Data is not arriving (severe stall)',
    fkey: 'Encrypted stream \u2014 needs a key',
    fsrc: 'Format not supported by the browser (likely HLS)',
    fabort: 'Loading aborted',
    fwhy: 'Reason: '
  }
};

var CST = {
  mini: 0, phase: '', t0: 0, tPlay: 0, why: '',
  buf: -1, bufs: 0, bw: 0, live: 0, lvls: 0,
  tries: 0, total: 0, timer: 0, fade: 0, nat: 0, bound: 0
};

function cstLang() {
  /* 必须走主程序统一的语言解析：语言默认是 auto，这里若还自己判 S.lang==='en'，
     auto 会被当成「不是英文」而永远回落中文 —— 英文界面下状态条就露中文了。
     拿不到 curLang（比如单独抽出这个文件测试）时才退回旧判断。 */
  if (typeof curLang === 'function') return curLang();
  return (typeof S !== 'undefined' && S && S.lang === 'en') ? 'en' : 'zh';
}
function cstTx(k, a) {
  var t = CST_T[cstLang()] || CST_T.zh;
  var s = t[k] || CST_T.zh[k] || k;
  if (a && typeof a === 'object') {
    for (var p in a) if (a.hasOwnProperty(p)) s = s.split('{' + p + '}').join(a[p]);
  } else if (a !== undefined) { s = s.split('{v}').join(a); }
  return s;
}
function cstNow() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
function cstEl(id) { return document.getElementById(id); }

/* ---------- 画 ---------- */
function cstPaint() {
  var w = cstEl('cst'); if (!w) return;
  var live = !!CST.phase;
  w.className = 'cst' + (live ? ' on' : '') + (CST.mini ? ' mini' : '') + (live ? ' ' + CST.phase : '');

  var ph = cstEl('cstPhase'), inf = cstEl('cstInfo'), bar = cstEl('cstBar'), fill = cstEl('cstFill');
  if (ph) ph.textContent = cstPhaseName();
  if (inf) inf.textContent = cstInfoTx();
  var pct = -1;
  if (CST.phase !== 'fail') {
    pct = (CST.buf >= 0) ? CST.buf : Math.min(100, Math.round((CST.bufs / 20) * 100));
  }
  if (bar) bar.classList.toggle('on', pct >= 0);
  if (fill) fill.style.width = (pct < 0 ? 0 : Math.max(2, pct)) + '%';
  if (w) w.title = cstTitle();

  /* 状态条已经在报连接状态了，右上角那个转圈就多余了 */
  if (live) { var sp = cstEl('spin'); if (sp) sp.classList.remove('on'); }
}

function cstPhaseName() {
  switch (CST.phase) {
    case 'conn': return cstTx('conn');
    case 'man': return cstTx('man');
    case 'buf': return cstTx('buf');
    case 'play': return cstTx('play');
    case 'stall': return cstTx('stall');
    case 'fail': return cstTx('fail');
    default: return cstTx('idle');
  }
}

function cstInfoTx() {
  var a = [];
  if (CST.phase === 'play') {
    a.push(cstTx('boot', (CST.tPlay / 1000).toFixed(1)));
  } else if (CST.phase === 'fail') {
    if (CST.why) a.push(cstTx('fwhy') + CST.why);
    if (CST.total > 1) a.push(cstTx('fall', { n: CST.total }));
  } else if (CST.phase && CST.t0) {
    a.push(cstTx('tick', ((cstNow() - CST.t0) / 1000).toFixed(1)));
    if (CST.total > 1) a.push(cstTx('line', { n: CST.tries, m: CST.total }));
  }
  if (CST.phase && CST.phase !== 'fail') {
    if (CST.nat) a.push(cstTx('nat'));
    /* 显示前方还能播多少秒 —— 比"占比"更能说明够不够看；占比交给进度条 */
    if (CST.bufs > 0.4) a.push(cstTx('bufS', CST.bufs.toFixed(1)));
    if (CST.phase === 'play' && CST.bw > 0) a.push(cstTx('bw', CST.bw));
  }
  return a.join(' · ');
}

function cstTitle() {
  var a = [];
  a.push(cstPhaseName() + (CST.phase ? ' · ' + cstInfoTx() : ''));
  if (CST.phase && CST.phase !== 'fail' && CST.buf >= 0) a.push(cstTx('bufP', CST.buf));
  if (CST.lvls) a.push('quality levels: ' + CST.lvls);
  if (CST.live) a.push('live');
  a.push(cstTx('key'));
  return a.join('\n');
}

/* ---------- 读 ---------- */
function cstReadBuf() {
  var v = cstEl('v'); if (!v) return;
  try {
    var b = v.buffered, cur = v.currentTime || 0;
    if (b && b.length) {
      var end = b.end(b.length - 1);
      CST.bufs = Math.max(0, end - cur);
      var d = v.duration;
      CST.buf = (isFinite(d) && d > 0) ? Math.min(100, Math.round(end / d * 100)) : -1;
      return;
    }
  } catch (e) {}
  CST.buf = -1; CST.bufs = 0;
}

/* ---------- 走 ---------- */
function cstTimer(on) {
  if (on && !CST.timer) CST.timer = setInterval(cstTick, 350);
  else if (!on && CST.timer) { clearInterval(CST.timer); CST.timer = 0; }
}

function cstTick() {
  if (!CST.phase) { cstTimer(0); return; }
  cstReadBuf();
  cstPaint();
  /* 播放正常后自动收起成小圆点，别挡画面 */
  if (CST.phase === 'play' && !CST.mini && CST.fade && (cstNow() - CST.fade > 3000)) {
    CST.mini = 1; cstPaint();
  }
}

function cstStart(url, total, nat) {
  CST.mini = 0; CST.phase = 'conn';
  CST.t0 = cstNow(); CST.tPlay = 0; CST.why = '';
  CST.tries = 1; CST.total = Math.max(1, total || 1);
  CST.buf = -1; CST.bufs = 0; CST.bw = 0; CST.live = 0; CST.lvls = 0;
  CST.fade = 0; CST.nat = nat ? 1 : 0;
  cstTimer(1); cstPaint();
}

function cstTry(n, total, nat) {
  if (!CST.phase) return;
  CST.tries = n || 1;
  if (total) CST.total = Math.max(1, total);
  CST.phase = 'conn'; CST.buf = -1; CST.bufs = 0;
  if (nat !== undefined) CST.nat = nat ? 1 : 0;
  cstTimer(1); cstPaint();
}

function cstSetPhase(p) {
  if (!CST.phase || CST.phase === 'fail' || CST.phase === p) return;
  CST.phase = p;
  cstReadBuf(); cstPaint();
}

function cstOk() {
  if (!CST.phase || CST.phase === 'fail') return;
  if (!CST.tPlay) {
    CST.tPlay = Math.max(1, cstNow() - CST.t0);   /* 首次出画面：记下起播耗时 */
    CST.fade = cstNow();                          /* 3 秒后自动收起，别挡画面 */
  }
  CST.phase = 'play';
  cstReadBuf(); cstPaint();
}

function cstFail(why) {
  CST.phase = 'fail';
  if (why) CST.why = why;
  CST.fade = 0;
  cstTimer(0); cstPaint();
}

function cstStop() {
  CST.phase = ''; CST.t0 = 0; CST.tPlay = 0; CST.why = '';
  CST.buf = -1; CST.bufs = 0; CST.bw = 0; CST.mini = 0; CST.fade = 0; CST.nat = 0;
  cstTimer(0); cstPaint();
}

/* ---------- 错误原因翻译成人话 ---------- */
function cstWhy(d) {
  if (!d) return '';
  var det = String(d.details || '');
  var code = 0;
  try {
    if (d.response && d.response.code) code = d.response.code;
    else if (d.networkDetails && d.networkDetails.status) code = d.networkDetails.status;
  } catch (e) {}
  if (/TimeOut/i.test(det)) return cstTx('fto');
  if (/manifestLoadError/i.test(det)) {
    if (code === 404) return cstTx('f404');
    if (code === 403) return cstTx('f403');
    return code ? (cstTx('fman') + ' (' + code + ')') : cstTx('fcors');
  }
  if (/manifestParsingError|manifestIncompatibleCodecsError/i.test(det)) return cstTx('fparse');
  if (/levelLoadError/i.test(det)) return code ? (cstTx('flevel') + ' (' + code + ')') : cstTx('flevel');
  if (/fragLoadError/i.test(det)) return code === 404 ? cstTx('ffrag404') : (code ? (cstTx('ffrag') + ' (' + code + ')') : cstTx('ffrag'));
  if (/bufferAppendError|bufferAppendingError|fragParsingError/i.test(det)) return cstTx('fappend');
  if (/bufferStalledError/i.test(det)) return cstTx('fstall');
  if (/keyLoadError|keySystemError/i.test(det)) return cstTx('fkey');
  if (/networkError/i.test(det)) return code ? (cstTx('fnet') + ' (' + code + ')') : cstTx('fcors');
  if (/mediaError/i.test(det)) return cstTx('fcodec');
  return det ? det : cstTx('fman');
}

function cstNativeWhy(v) {
  var e = v && v.error; if (!e) return '';
  if (e.code === 1) return cstTx('fabort');
  if (e.code === 2) return cstTx('fnet');
  if (e.code === 3) return cstTx('fappend');
  if (e.code === 4) return cstTx('fsrc');
  return '';
}

/* ---------- 挂钩子（不改播放流程，只旁听） ---------- */
function cstAttachHls(h, my) {
  if (!h || !h.on || !window.Hls || !window.Hls.Events) return;
  var E = window.Hls.Events;

  if (CAPD.rlang !== 'auto') { CAPD.rlang = 'auto'; ch = 1; }   /* 一键就用自动检测，别让选错的语言拖累翻译 */
  if (!CAPD.to) { CAPD.to = 'zh-CN'; ch = 1; }

var CAPDOC = { busy: 0, rows: null };

/* 把错误码翻成人话 */
function capErrTx(e) {
  var s = String(e == null ? '' : e);
  if (/audio-capture|NotFoundError|Requested device not found/i.test(s)) return L('err_nomic');
  if (/not-allowed|NotAllowedError|Permission|denied/i.test(s)) return L('err_perm');
  if (/language-not-supported/i.test(s)) return L('err_lang');
  if (/network/i.test(s)) return L('err_net');
  if (/AbortError|aborted|timeout/i.test(s)) return L('err_timeout');
  if (/^401$|^403$/.test(s)) return L('cap_asr_401');
  return s;
}

/* 音频输入设备数。-1 = 查不到 */
function capDocMicCount() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve(-1);
  return navigator.mediaDevices.enumerateDevices().then(function (ds) {
    var n = 0;
    for (var i = 0; i < ds.length; i++) if (ds[i].kind === 'audioinput') n++;
    return n;
  })['catch'](function () { return -1; });
}

/* 0.6 秒静音 WAV：拿来验证识别服务到底通不通（不涉隐私、几乎零成本） */
function capDocWav() {
  try {
    var sr = 16000, n = Math.round(sr * 0.6), buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
    var ws = function (o, t) { for (var i = 0; i < t.length; i++) dv.setUint8(o + i, t.charCodeAt(i)); };
    ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    ws(36, 'data'); dv.setUint32(40, n * 2, true);
    return new Blob([buf], { type: 'audio/wav' });
  } catch (e) { return null; }
}

function capDocAsrProbe() {
  var url = capAsrUrl(), key = capAsrKey();
  if (!url || !key) return Promise.resolve({ s: 0 });
  var b = capDocWav();
  if (!b) return Promise.resolve({ s: 0 });
  var fd = new FormData();
  fd.append('file', b, 'probe.wav');
  fd.append('model', capAsrModel());
  fd.append('response_format', 'json');
  var ctl = null, tm = null, opts = { method: 'POST', body: fd, cache: 'no-store', headers: { Authorization: 'Bearer ' + key } };
  try {
    ctl = new AbortController(); opts.signal = ctl.signal;
    tm = setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 20000);
  } catch (e) {}
  return fetch(url, opts).then(function (r) {
    if (tm) clearTimeout(tm);
    return r.text().then(function (t) { return { s: r.status, b: String(t || '').slice(0, 120) }; });
  })['catch'](function (e) {
    if (tm) clearTimeout(tm);
    return { s: -1, b: String((e && e.name) || e) };
  });
}

/* 声音来源 */
function capDocSrcRow() {
  var k = L('doc_src'), v = $('#v');
  if (!v) return { s: 'bad', k: k, v: L('doc_src_novid') };
  if (CASA.on) return { s: 'ok', k: k, v: L('doc_src_running') };
  var hasSrc = !!(v.currentSrc || v.src || v.srcObject);
  var playing = hasSrc && v.readyState >= 2 && !v.paused && v.currentTime > 0;
  if (!playing) return { s: 'warn', k: k, v: L('doc_src_idle'), fix: L('doc_src_idle_fix') };
  var tr = -1;
  try {
    var st = v.captureStream ? v.captureStream() : null;
    if (st) tr = st.getAudioTracks().length;
  } catch (e) { tr = -1; }
  if (tr > 0) return { s: 'ok', k: k, v: L('doc_src_ok') };
  return { s: 'warn', k: k, v: L('doc_src_cross'), fix: L('doc_src_cross_fix') };
}

async function capDocAsrRow() {
  var k = L('doc_asr');
  if (CAPD.asr === 'off') return { s: 'bad', k: k, v: L('doc_asr_off'), fix: L('doc_asr_off_fix') };
  if (CAPD.asr === 'browser') {
    var mn = await capDocMicCount();
    if (mn === 0) return { s: 'bad', k: k, v: L('doc_asr_brmic'), fix: L('doc_asr_brmic_fix') };
    return { s: 'warn', k: k, v: L('doc_asr_br'), fix: L('doc_asr_br_fix') };
  }
  if (!capAsrUrl()) return { s: 'bad', k: k, v: L('doc_asr_nourl'), fix: L('doc_asr_nourl_fix') };
  if (!capAsrKey()) return { s: 'bad', k: k, v: L('doc_asr_nokey'), fix: L('doc_asr_keyhint') };
  var r = await capDocAsrProbe();
  if (r.s === 200) return { s: 'ok', k: k, v: L('doc_asr_ok', { s: capAsrModel() }) };
  if (r.s === 401 || r.s === 403) return { s: 'bad', k: k, v: L('doc_asr_bad', { s: r.s }), fix: L('doc_asr_keyhint') };
  if (r.s === 0) return { s: 'bad', k: k, v: L('doc_asr_nourl'), fix: L('doc_asr_nourl_fix') };
  if (r.s === -1) return { s: 'bad', k: k, v: L('doc_asr_net', { e: r.b }), fix: L('doc_asr_netfix') };
  return { s: 'warn', k: k, v: L('doc_asr_code', { s: r.s, b: r.b }) };
}

async function capDocTrRow() {
  var k = L('doc_tr');
  var to = capCode(CAPD.to) || 'zh';
  var from = capTrFrom() || '';
  var probe = from || 'en';
  if (CAPD.engine === 'off') return { s: 'warn', k: k, v: L('doc_tr_off'), fix: L('doc_tr_off_fix') };
  if (CAPD.engine === 'native') {
    if (!capHasNativeTr()) return { s: 'bad', k: k, v: L('doc_tr_native_no'), fix: L('doc_tr_native_fix') };
    var a = '?';
    try { a = await window.Translator.availability({ sourceLanguage: probe, targetLanguage: to }); }
    catch (e) { a = 'err'; }
    if (a === 'available') return { s: 'ok', k: k, v: L('doc_tr_native_ok', { a: probe, b: to }) };
    if (a === 'downloadable' || a === 'downloading') return { s: 'warn', k: k, v: L('doc_tr_native_dl', { a: probe, b: to }), fix: L('doc_tr_dl_fix') };
    return { s: 'warn', k: k, v: L('doc_tr_native_pair', { a: probe, b: to }), fix: L('doc_tr_native_fix') };
  }
  if (CAPD.engine === 'mymemory') {
    var u = 'https://api.mymemory.translated.net/get?q=hello&langpair=en%7C' + encodeURIComponent(to);
    try {
      var r = await fetch(u, { cache: 'no-store' });
      if (r.ok) return { s: 'ok', k: k, v: L('doc_tr_mm_ok') };
      return { s: 'bad', k: k, v: L('doc_tr_bad', { s: 'MyMemory', e: r.status }) };
    } catch (e) {
      return { s: 'bad', k: k, v: L('doc_tr_bad', { s: 'MyMemory', e: String((e && e.name) || e) }) };
    }
  }
  if (CAPD.engine === 'sf') {
    if (capAsrKey()) return { s: 'ok', k: k, v: L('doc_tr_sf_ok') };
    return { s: 'bad', k: k, v: L('doc_tr_sf_nokey'), fix: L('doc_asr_keyhint') };
  }
  if (String(CAPD.ep || '').trim()) return { s: 'ok', k: k, v: L('doc_tr_ok', { s: L('eng_custom') }) };
  return { s: 'bad', k: k, v: L('doc_tr_nourl') };
}
