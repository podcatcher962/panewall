async function capDoctor() {
  if (CAPDOC.busy) return;
  CAPDOC.busy = 1;
  capDocSay(L('cap_doc_doing'));
  var rows = [];
  try {
    var ua = navigator.userAgent || '';
    var brName = /Edg\//.test(ua) ? 'Edge' : (/Chrome\//.test(ua) ? 'Chrome' : (/Safari\//.test(ua) ? 'Safari' : 'Browser'));
    var mv = ua.match(/(?:Edg|Chrome|Firefox|Version)\/(\d+)/);
    var natOK = capHasNativeTr();
    rows.push({
      s: (brName === 'Edge' || brName === 'Chrome') ? 'ok' : 'warn',
      k: L('doc_browser'),
      v: brName + ' ' + (mv ? mv[1] : '?') + ' \u00b7 ' + (natOK ? L('doc_br_nat') : L('doc_br_nonat')),
      fix: natOK ? '' : L('doc_br_nonat_fix')
    });

    var mn = await capDocMicCount();
    if (mn < 0) rows.push({ s: 'warn', k: L('doc_mic'), v: L('doc_mic_unk') });
    else if (mn === 0) rows.push({ s: 'warn', k: L('doc_mic'), v: L('doc_mic_none'), fix: L('doc_mic_fix') });
    else rows.push({ s: 'ok', k: L('doc_mic'), v: L('doc_mic_n', { n: mn }) });

    rows.push(capDocSrcRow());
    rows.push(await capDocAsrRow());
    rows.push(await capDocTrRow());
    if (CAP.err) rows.push({ s: 'bad', k: L('doc_last'), v: capErrTx(CAP.err) });
  } catch (e) {
    rows.push({ s: 'warn', k: 'internal', v: String(e).slice(0, 120) });
  }
  capDocRender(rows);
  CAPDOC.busy = 0;
}

/* ---- 12c. 统一开关（按引擎分派） ---- */
function capLiveStart() {
  if (CAP.on) return;
  capWarmNative();
  if (CAPD.asr === 'browser') { capSrStart(); return; }
  if (CAPD.asr === 'off') { toast(L('cap_need_asr')); capModal(); return; }
  capAudioStart();
}
function capLiveStop() {
  if (CASA.on) capAudioStop();
  if (CAP.rec) capSrStop();
  CAP.on = 0;
  CAP.pending = '';
  if (CAP.mode === 'live' || CAP.mode === 'br') capLiveRender();
  capSync();
  toast(L('cap_off'));
}

/* ---- 13. 启动 ---- */
function capInit() {
  CAP.rlangLive = '';
  capApply();
  capBindDrag();
  capBindOne();
  capSync();
  if (CAPD.live && CAPD.asr !== 'off') setTimeout(function () { if (!CAP.on) capLiveStart(); }, 800);
}


/* ---------------- theme / views ---------------- */
function resolvedTheme() {
  if (S.theme === 'light' || S.theme === 'dark') return S.theme;
  try { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'dark'; }
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', resolvedTheme());
  document.documentElement.setAttribute('data-motion', S.motion || 'full');
  document.documentElement.style.setProperty('--ui', (S.ui / 100));
  document.documentElement.lang = (curLang() === 'en' ? 'en' : 'zh-CN');
}
function showView(v) {
  CUR_VIEW = v;
  $$('.view').forEach(function (e) { e.classList.toggle('on', e.id === 'view-' + v); });
  $$('#nav button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
  if (v === 'help' || v === 'faq' || v === 'disc' || v === 'about') renderDoc(v);
  if (v === 'set') renderSet();
  if (v === 'fav') renderFav();
  if (v === 'rec') renderRec();
  if (v === 'mos') renderMos();
  try { window.scrollTo(0, 0); } catch (e) {}
}

/* ---------------- events ---------------- */
function bind() {
  // nav
  $('#nav').addEventListener('click', function (e) {
    var b = closestAttr(e.target, 'data-v');
    if (b) showView(b.getAttribute('data-v'));
  });

  // main delegated clicks
  document.addEventListener('click', function (e) {
    var t;
    if ((t = closestAttr(e.target, 'data-close'))) { closeModal(); return; }
    if ((t = closestAttr(e.target, 'data-cat'))) { CAT = t.getAttribute('data-cat'); renderCats(); renderList(); return; }
    if ((t = closestAttr(e.target, 'data-fav'))) { toggleFav(t.getAttribute('data-fav')); return; }
    if ((t = closestAttr(e.target, 'data-play'))) { playChannel(findCh(t.getAttribute('data-play')) || { n: L('none_ch'), u: t.getAttribute('data-play') }); return; }
    if ((t = closestAttr(e.target, 'data-addlist'))) { addListDialog(t.getAttribute('data-addlist')); return; }
    if ((t = closestAttr(e.target, 'data-mosclose'))) { mosClose(parseInt(t.getAttribute('data-mosclose'), 10)); return; }
    if ((t = closestAttr(e.target, 'data-cell'))) { MOS.sel = parseInt(t.getAttribute('data-cell'), 10); renderMos(); return; }
    if ((t = closestAttr(e.target, 'data-putto'))) { putToList(t.getAttribute('data-putto'), pendingCh); return; }
      if ((t = closestAttr(e.target, 'data-recdl'))) { var r1 = RECS[parseInt(t.getAttribute('data-recdl'), 10)]; if (r1) download(r1.url, r1.name); return; }
    if ((t = closestAttr(e.target, 'data-recdel'))) { var idx = parseInt(t.getAttribute('data-recdel'), 10); var r2 = RECS[idx]; if (r2) { try { URL.revokeObjectURL(r2.url); } catch (x) {} RECS.splice(idx, 1); renderRec(); } return; }
    if ((t = closestAttr(e.target, 'data-segval'))) { applySeg(t); return; }
    if ((t = closestAttr(e.target, 'data-act2'))) { modalAct(t.getAttribute('data-act2')); return; }
    if ((t = closestAttr(e.target, 'data-act'))) { act(t.getAttribute('data-act')); return; }
    if (e.target.id === 'modal') { closeModal(); return; }
  }, false);

  // keyboard on list rows
  $('#list').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    var row = closestAttr(e.target, 'data-play');
    if (row) { e.preventDefault(); row.click(); }
  });

  // search
  var qi = $('#q');
  qi.addEventListener('input', function () {
    Q = qi.value;
    $('#btnClearQ').classList.toggle('hide', !Q);
    renderList();
  });
  $('#btnClearQ').addEventListener('click', function () { qi.value = ''; Q = ''; this.classList.add('hide'); renderList(); qi.focus(); });

  $('#fFiles').addEventListener('change', function () { importFiles(this.files); this.value = ''; });
  $('#fDir').addEventListener('change', function () { importFiles(this.files); this.value = ''; });
  $('#fJson').addEventListener('change', function () { importJson(this.files[0]); this.value = ''; });

  // drag & drop
  ['dragover', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, false); });
  document.addEventListener('drop', function (e) {
    var items = e.dataTransfer && e.dataTransfer.files;
    if (items && items.length) importFiles(items);
  }, false);

  // volume
  var vol = $('#vol');
  vol.addEventListener('input', function () {
    var v = $('#v'); if (!v) return;
    v.volume = parseFloat(vol.value);
    v.muted = (parseFloat(vol.value) === 0);
    $('#btnMute').textContent = v.muted ? '🔇' : '🔊';
  });

  // video click = play/pause
  $('#v').addEventListener('click', function () {
    var v = this;
    if (!P.url) return;
    if (v.paused) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
    else v.pause();
  });

  // system theme
  try {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    var onch = function () { if (S.theme === 'system') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onch); else if (mq.addListener) mq.addListener(onch);
  } catch (e) {}

  // settings inputs (delegated change)
  document.addEventListener('input', function (e) {
    if (e.target.id === 'setUi') {
      S.ui = parseInt(e.target.value, 10) || 100;
      $('#setUiV').textContent = S.ui + '%';
      applyTheme();
    }
  }, false);
  document.addEventListener('change', function (e) {
    if (e.target.id === 'setProxy') { S.proxy = e.target.value.trim(); saveSet(); if (S.proxy) toast(L('proxy_applied')); }
  }, false);
  var rmin = $('#recMin');
  if (rmin) { rmin.value = String(S.recMin || 0); rmin.addEventListener('change', function () { S.recMin = parseInt(rmin.value, 10) || 0; saveSet(); }); }

  // 源库切换（每个导入的文件夹 = 一个独立库，互相不混）
  var lsel = $('#libSel');
  if (lsel) lsel.addEventListener('change', function () {
    DB.cur = this.value;
    CAT = CAT_ALL; Q = '';
    var qi2 = $('#q'); if (qi2) qi2.value = '';
    var bc2 = $('#btnClearQ'); if (bc2) bc2.classList.add('hide');
    saveDB(); renderAll();
  });
  // 音视频切换
  var mbar = $('#mtBar');
  if (mbar) mbar.addEventListener('click', function (e) {
    var b = closestAttr(e.target, 'data-mt');
    if (!b) return;
    MTYPE = b.getAttribute('data-mt');
    CAT = CAT_ALL;
    renderAll();
  });
}
var pendingCh = null;
function applySeg(btn) {
  var box = closestAttr(btn, 'data-seg'); if (!box) return;
  var key = box.getAttribute('data-seg'), val = btn.getAttribute('data-segval');
  if (key === 'theme') S.theme = val;
  else if (key === 'lang') { S.lang = val; }
  else if (key === 'autoNext') S.autoNext = parseInt(val, 10);
  else if (key === 'fit') { S.fit = val; applyFit(); }
  else if (key === 'lpx') {
    S.lpx = (parseInt(val, 10) === 0) ? 0 : 1;
    toast(S.lpx ? L('lpx_on') : L('lpx_off'));
    if (P.url) startPlay(P.url);      /* 换通道要重连一次才生效 */
  }
  else if (key === 'capSrc') { CAPD.showsrc = (val === '1') ? 1 : 0; capSave(); capApply(); capShow(); }
  saveSet();
  $$('[data-seg="' + key + '"] button').forEach(function (b) { b.classList.toggle('on', b === btn); });
  applyTheme();
  fillLabels();
  renderAll();
  if (CUR_VIEW === 'help' || CUR_VIEW === 'faq' || CUR_VIEW === 'disc' || CUR_VIEW === 'about') renderDoc(CUR_VIEW);
}
function modalAct(a) {
  if (a === 'urlGo') {
    var u = $('#mUrl') && $('#mUrl').value.trim();
    var n = $('#mUrlName') && $('#mUrlName').value.trim();
    if (!u) { toast(L('need_url')); return; }
    closeModal(); fetchUrlList(u, n || '');
  } else if (a === 'listGo') {
    var nm = $('#mListName') && $('#mListName').value.trim();
    putToList(nm, pendingCh);
  } else if (a === 'pickCell') {
    closeModal();
  } else if (a === 'libMerge' || a === 'libNew') {
    closeModal();
    if (pendingImport) {
      doImport(pendingImport.files, pendingImport.name, a === 'libMerge' ? 'merge' : 'new');
      pendingImport = null;
    }
  }
}
function act(a) {
  var v = $('#v');
  switch (a) {
    case 'impFile': $('#fFiles').click(); break;
    case 'impDir': $('#fDir').click(); break;
    case 'impUrl': importUrlDialog(); break;
    case 'scan': scanCurrent(); break;
    case 'clear': {
      var lb0 = curLib();
      if (DB.cur === 'all' || !lb0) {
        if (confirm(L('del_all'))) { DB.libs = []; DB.cur = 'all'; saveDB(); renderAll(); toast(L('cleared')); }
      } else if (confirm(L('del_lib', { n: lb0.name }))) {
        removeLib(lb0.id); renderAll(); toast(L('cleared'));
      }
      break;
    }
    case 'libDel': {
      var lb1 = curLib();
      if (!lb1) { toast(L('lib_none')); break; }
      if (confirm(L('del_lib', { n: lb1.name }))) { removeLib(lb1.id); renderAll(); toast(L('cleared')); }
      break;
    }
    case 'libRename': {
      var lb2 = curLib();
      if (!lb2) { toast(L('lib_none')); break; }
      var nn = prompt(L('lib_rename'), lb2.name);
      if (nn && nn.trim()) { lb2.name = nn.trim(); saveDB(); renderAll(); }
      break;
    }
    case 'pp': if (v) { if (v.paused) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } else v.pause(); } break;
    case 'prev': var pv = neighbor(-1); if (pv) playChannel(pv); break;
    case 'next': var nx = neighbor(1); if (nx) playChannel(nx); break;
    case 'mute': if (v) { v.muted = !v.muted; $('#btnMute').textContent = v.muted ? '🔇' : '🔊'; } break;
    case 'shot': shot(); break;
    case 'recV': recStart('video'); break;
    case 'recA': recStart('audio'); break;
    case 'recStop': recStop(); break;
    case 'pip': if (v && v.requestPictureInPicture) { var q = v.requestPictureInPicture(); if (q && q.catch) q.catch(function () { toast(L('pip_fail')); }); } else toast(L('pip_fail')); break;
    case 'full': var pvw = $('#pv'); if (pvw && pvw.requestFullscreen) { var f = pvw.requestFullscreen(); if (f && f.catch) f.catch(function () { toast(L('full_fail')); }); } else toast(L('full_fail')); break;
    case 'fit': {
      var order = ['contain', 'cover', '169', '43', 'none'];
      var i2 = order.indexOf(S.fit); S.fit = order[(i2 + 1) % order.length];
      saveSet(); applyFit(); toast(L('set_fit') + '：' + ({ contain: L('fit_contain'), cover: L('fit_cover'), '169': '16:9', '43': '4:3', none: L('fit_none') })[S.fit]);
      break;
    }
    case 'capCfg': capModal(); break;
    case 'capToggle': if (CAP.on) capLiveStop(); else capLiveStart(); capModal(); break;
    case 'capClear': capClearAll(); break;
    case 'capPack': capPack(); break;
    case 'capDetect': capDetect(function () { }); break;
    case 'capTest': capTestEngine(); break;
    case 'capDoc': capDoctor(); break;
    case 'capOne': capOneClick(); break;
    case 'pxTest': pxCheck(); break;
    case 'addList': pendingCh = P.ch; addListDialog(null); break;
    case 'favCur': if (P.ch) toggleFav(P.ch.u); break;
    case 'toMos': mosAddCurrent(); showView('mos'); break;
    case 'favExport': exportFavM3u(); break;
    case 'favGo': showView('live'); break;
    case 'mosLayout': break;
    case 'mosClear': MOS.cells = []; renderMos(); break;
    case 'expJson': exportJson(); break;
    case 'impJson': $('#fJson').click(); break;
    case 'reset': if (confirm(L('b_reset'))) { S = { theme: 'dark', lang: 'auto', ui: 100, motion: 'full', autoNext: 1, fit: 'contain', proxy: '', recMin: 0, lpx: 1 }; saveSet(); applyTheme(); fillLabels(); renderAll(); renderSet(); toast(L('reset_ok')); } break;
  }
}
/* mosaic layout buttons (data-n) */
document.addEventListener('click', function (e) {
  var t = closestAttr(e.target, 'data-n');
  if (!t) return;
  var act0 = t.getAttribute('data-act');
  if (act0 !== 'mosLayout') return;
  MOS.n = parseInt(t.getAttribute('data-n'), 10) || 4;
  if (MOS.cells.length > MOS.n) MOS.cells = MOS.cells.slice(0, MOS.n);
  while (MOS.cells.length < MOS.n) MOS.cells.push(null);
  if (MOS.sel >= MOS.n) MOS.sel = 0;
  renderMos();
}, false);

/* ---------------- json backup ---------------- */
function exportJson() {
  var pack = { app: 'PaneWall', v: 2, at: new Date().toISOString(), set: S,
               libs: DB.libs, cur: DB.cur, favs: DB.favs, lists: DB.lists, recent: DB.recent };
  var blob = new Blob([JSON.stringify(pack)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  download(url, L('fn_bak') + '_' + tsName() + '.json');
  toast(L('exported'));
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}
function importJson(file) {
  if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var o = JSON.parse(String(r.result));
      if (!o || (o.app !== 'PaneWall' && o.app !== 'XianLattice')) { toast(L('import_bad')); return; }
      if (o.set) S = o.set;
      if (o.libs) DB.libs = o.libs;
      else if (o.chs) {   /* 兼容 v1 备份：单库 → 一个源库 */
        DB.libs = [{ id: uid(), name: L('lib_default'), kind: 'mixed', ts: Date.now(),
                     srcs: o.srcs || [], chs: o.chs }];
        DB.cur = DB.libs[0].id;
      }
      if (o.cur && libById(o.cur)) DB.cur = o.cur;
      if (o.favs) DB.favs = o.favs;
      if (o.lists) DB.lists = o.lists;
      if (o.recent) DB.recent = o.recent;
      saveSet(); saveDB(); saveFav(); saveLists(); saveRecent();
      applyTheme(); fillLabels(); renderAll(); renderSet();
      toast(L('import_ok'));
    } catch (e) { toast(L('import_bad')); }
  };
  r.readAsText(file, 'utf-8');
}

/* ---------------- init ---------------- */
function init() {
  migrateOld();
  applyTheme();
  fillLabels();
  bind();
  renderAll();
  syncRecUI();
  capInit();
  cstInit();
  var pvw = $('#pv'); if (pvw) pvw.style.aspectRatio = '16/9';
  var hint = $('#mosHint'); if (hint) hint.textContent = '';
  showView('live');
  var rmin = $('#recMin'); if (rmin) rmin.value = String(S.recMin || 0);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

/* expose a few things for automated checks (harmless) */
window.XL = {
  S: S, get DB() { return DB; }, get P() { return P; }, get REC() { return REC; }, get RECS() { return RECS; },
  get HEALTH() { return HEALTH; }, get MOS() { return MOS; },
  parseM3U: parseM3U, L: L, cats: cats, filtered: filtered, groupOf: groupOf,
  playChannel: playChannel, showView: showView, toggleFav: toggleFav, putToList: putToList,
  pyOf: pyOf, fullPy: fullPy, probeUrl: probeUrl, HLS_NATIVE: HLS_NATIVE, HLS_JS_OK: HLS_JS_OK,
  HLS_CAN_NATIVE: HLS_CAN_NATIVE,
  renderAll: renderAll, renderList: renderList, renderCats: renderCats, renderMos: renderMos,
  mosSet: mosSet, addChannels: addChannels, setQ: function (v) { Q = v; renderList(); },
  setCat: function (v) { CAT = v; renderCats(); renderList(); },
  shot: shot, recStart: recStart, recStop: recStop, act: act, version: 'v1.8',
  /* 桌面版 / 本机代理 */
  DT: DT, isDesk: isDesk, pxLocal: pxLocal, pxPrefix: pxPrefix, pxCheck: pxCheck,
  variants: variants, prox: prox, startPlay: startPlay,
  /* 连接状态条 */
  get CST() { return CST; }, cstStart: cstStart, cstStop: cstStop, cstPaint: cstPaint,
  cstInfoTx: cstInfoTx, cstPhaseName: cstPhaseName, cstWhy: cstWhy, cstNativeWhy: cstNativeWhy,
  cstFail: cstFail, cstOk: cstOk, cstReadBuf: cstReadBuf, cstSetPhase: cstSetPhase,
  cstTx: cstTx, cstTry: cstTry, stopP: stopP,
  /* 字幕 / 实时翻译 */
  get CAP() { return CAP; }, get CAPD() { return CAPD; }, get CASA() { return CASA; },
  capModal: capModal, capLiveStart: capLiveStart, capLiveStop: capLiveStop,
  capOneClick: capOneClick, capDoctor: capDoctor,
  capDocRender: capDocRender, capDocTodo: capDocTodo,
  capErrTx: capErrTx, capDocMicCount: capDocMicCount,
  get CAPDOC() { return CAPDOC; },
  capTranslate: capTranslate, capSubLine: capSubLine, capPushLine: capPushLine,
  capClearAll: capClearAll, capCode: capCode, capSave: capSave, capSegLoop: capSegLoop,
  capAudioStart: capAudioStart, capInject: function (st) { CAP.inject = st; }, capGrabStream: capGrabStream,
  capApply: capApply, capShow: capShow, capAttachHls: capAttachHls,
  capApi: function () { return { url: capAsrUrl(), model: capAsrModel(), hasKey: !!capAsrKey(), seg: CAPD.seg, asr: CAPD.asr, asrc: CAPD.asrc, pick: capPickSrc(), desktop: capIsDesktop(), rlang: CAPD.rlang, rlangLive: CAP.rlangLive, engine: CAPD.engine, to: CAPD.to, from: capTrFrom(), native: capHasNativeTr() }; },
  /* v1.3 免费翻译 / 语言自动检测 / 智能声源 */
  capPack: capPack, capWarmNative: capWarmNative, capPickSrc: capPickSrc, capIsDesktop: capIsDesktop,
  capGuessLang: capGuessLang, capScriptLang: capScriptLang, capLangLabel: capLangLabel,
  capSameLang: capSameLang, capTrFrom: capTrFrom, capSetSrcLang: capSetSrcLang,
  capHasNativeTr: capHasNativeTr, capHasNativeDet: capHasNativeDet,
  capNativeDet: capNativeDet, capNativeGet: capNativeGet, capSfTr: capSfTr,
  get CAPNL() { return CAPNL; },
  /* 多源库自动化检查用 */
  newLib: newLib, removeLib: removeLib, saveDB: saveDB, curChs: curChs, allChs: allChs,
  mediaKind: mediaKind, libStats: libStats, findCh: findCh,
  get MTYPE() { return MTYPE; },
  setMT: function (v) { MTYPE = v; CAT = CAT_ALL; renderAll(); },
  setLib: function (v) { DB.cur = v; CAT = CAT_ALL; saveDB(); renderAll(); },
  importFiles: importFiles, doImport: doImport
};
})();
